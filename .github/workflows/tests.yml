name: tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: reels/requirements-dev.txt

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r reels/requirements-dev.txt

      # ffmpeg는 imageio-ffmpeg가 정적 바이너리를 들고 오고,
      # libmediainfo는 pymediainfo 휠에 들어 있어 apt 설치가 필요 없다.
      # 받아쓰기(faster-whisper)는 모델 다운로드가 필요해 CI에서 돌리지 않는다.
      - name: 도구 확인
        run: |
          python -c "import imageio_ffmpeg; print('ffmpeg:', imageio_ffmpeg.get_ffmpeg_exe())"
          python -c "import pymediainfo; print('mediainfo:', pymediainfo.MediaInfo.can_parse())"
          python -c "import pycapcut; print('pycapcut ok')"

      - name: 문법 검사
        run: python -m compileall -q reels

      - name: CLI 동작 확인
        run: |
          python -m reels --help > /dev/null
          for c in all sfx transitions broll doctor; do
            python -m reels "$c" --help > /dev/null
          done

      - name: 플랫폼 분기 (test_platforms)
        run: python reels/tests/test_platforms.py

      - name: 환경 점검 (test_doctor)
        run: python reels/tests/test_doctor.py

      - name: 컷편집·자막 (test_pipeline)
        run: python reels/tests/test_pipeline.py

      - name: 효과음 (test_sfx)
        run: python reels/tests/test_sfx.py

      - name: 장면 전환 (test_transitions)
        run: python reels/tests/test_transitions.py

      - name: 자료 화면 (test_broll)
        run: python reels/tests/test_broll.py
