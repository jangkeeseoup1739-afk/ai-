<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      아래 %SEO_xxx% 값은 빌드할 때 src/config/site.ts 의 seo 항목으로 자동 치환됩니다.
      이 파일을 직접 고치지 말고 site.ts 를 수정하세요.
    -->
    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <meta name="keywords" content="%SEO_KEYWORDS%" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0F1F3D" />
    <meta name="format-detection" content="telephone=no" />
    <!--%NAVER_VERIFICATION%-->

    <!-- Open Graph (카카오톡·페이스북·네이버 공유 미리보기) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="%SEO_SITE_NAME%" />
    <meta property="og:title" content="%SEO_TITLE%" />
    <meta property="og:description" content="%SEO_DESCRIPTION%" />
    <meta property="og:image" content="%SEO_OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SEO_TITLE%" />
    <meta name="twitter:description" content="%SEO_DESCRIPTION%" />
    <meta name="twitter:image" content="%SEO_OG_IMAGE%" />
    <!--%SEO_URL_TAGS%-->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- 한글 웹폰트 Pretendard (필요한 글자만 내려받는 dynamic-subset 버전) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
  </head>
  <body>
    <!-- 빌드 시 아래 주석 자리에 페이지 HTML이 미리 그려져 들어갑니다(프리렌더링 → 검색 노출에 유리). -->
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
